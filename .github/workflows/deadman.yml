name: deadman
on:
  schedule:
    - cron: "0 18 * * 5"  # Fridays 18:00 UTC — day after the Thursday publish
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fail if the weekly publish is stale
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "last publish: $age_days days ago"
          if [ "$age_days" -ge 8 ]; then
            echo "STALE=1" >> "$GITHUB_ENV"
          fi
      - name: open alert issue
        if: env.STALE == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "deadman"});
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: "Coupon brief did not publish this week",
                body: "No catalog push in 8+ days — the Thursday run on the laptop likely never fired. Check the box, Task Scheduler, and data/logs/.",
                labels: ["deadman"],
              });
            }
